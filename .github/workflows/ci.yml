name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gates:
    name: Release gates
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.3 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # #303: on a failed run, say whether the recorder was attached. Run
      # 31026009385 failed on a real 30s browser timeout and published nothing,
      # and "quiet" was indistinguishable from "never attached". This writes a
      # status file into the artifact directory before the upload, so the upload
      # always carries an answer. Names and counts only — never contents.
      #
      # The verdict is built from RUNTIME evidence, not from a source survey
      # (@re1, PR #304): `test-run.tap` — written by the Test step above — says
      # which tests actually failed, and each is then matched against the record
      # it did or did not produce. A test that throws before the recorder
      # attaches is reported as NOT attached, never as quiet.
      - name: Report diagnostics attachment status
        if: failure()
        run: node scripts/diagnostics-attachment-status.mjs

      # #289: only produced when a browser test fails, and redacted by
      # construction — the recorder never reads headers or bodies, so there is
      # nothing credential-shaped to strip before this public repository serves
      # the artifact for download.
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: test-artifacts/
          # The status step above guarantees a file, so an empty upload now means
          # the status step itself did not run — worth failing on rather than
          # ignoring, since ignoring it is what produced this ticket.
          if-no-files-found: error
          # #303: must outlast the #289 retirement bound (no failing trace within
          # 30 days or 200 CI runs). At 14 days a trace captured early in the
          # window expired before the decision it exists to inform.
          retention-days: 30

      - name: No stubs
        run: pnpm no-stub

      - name: Whitespace check
        run: |
          git config --global --add safe.directory '*'
          git diff --check
